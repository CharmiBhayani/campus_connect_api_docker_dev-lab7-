# Render.com Deployment Blueprint - Free Tier Compatible
# All services are deployed as web services (free tier does not support private services)
# Only the API Gateway URL needs to be shared with clients - microservice URLs are internal
services:
  # ── API Gateway (Public Entry Point) ────────────────────────────────────────
  - type: web
    name: campusconnect-api-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: USER_SERVICE_URL
        value: https://campusconnect-user-service.onrender.com
      - key: PRODUCT_SERVICE_URL
        value: https://campusconnect-product-service.onrender.com
      - key: ORDER_SERVICE_URL
        value: https://campusconnect-order-service.onrender.com

  # ── User Service ─────────────────────────────────────────────────────────────
  - type: web
    name: campusconnect-user-service
    runtime: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false  # ⚠️ Set this manually in Render Dashboard → your MongoDB Atlas URI

  # ── Product Service ───────────────────────────────────────────────────────────
  - type: web
    name: campusconnect-product-service
    runtime: docker
    dockerfilePath: ./product-service/Dockerfile
    dockerContext: ./product-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3002
      - key: MONGODB_URI
        sync: false  # ⚠️ Set this manually in Render Dashboard → your MongoDB Atlas URI

  # ── Order Service ─────────────────────────────────────────────────────────────
  - type: web
    name: campusconnect-order-service
    runtime: docker
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: ./order-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3003
      - key: MONGODB_URI
        sync: false  # ⚠️ Set this manually in Render Dashboard → your MongoDB Atlas URI
      - key: USER_SERVICE_URL
        value: https://campusconnect-user-service.onrender.com
      - key: PRODUCT_SERVICE_URL
        value: https://campusconnect-product-service.onrender.com
      - key: FETCH_TIMEOUT_MS
        value: 10000
